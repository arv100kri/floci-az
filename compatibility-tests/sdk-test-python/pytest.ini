[pytest]
testpaths = tests
markers =
    search_mvp: Azure AI Search MVP (indexes, documents, simple queries, API keys)
    search_query: Azure AI Search query features (Lucene, facets, suggest, synonyms, scoring profiles, aliases, analyzers)
    search_vector: Azure AI Search vector, filtered vector and hybrid queries
    search_indexer: Azure AI Search data sources, indexers and skills
    search_arm: Azure AI Search management plane (Microsoft.Search/searchServices)
    search_identity: Azure AI Search identity (Entra tokens, authOptions, disableLocalAuth, document-level permission filters)
